name: deploy-pages

# Publishes the static front door to GitHub Pages.
#
# Pair this with Settings → Pages → Source = "GitHub Actions". Do NOT use
# "Deploy from a branch": that path runs Jekyll, and because the repo root has
# no index.html it renders README.md as the homepage instead of this site.
#
# If you are enabling Pages from a script instead of Settings, note that Pages
# must exist before this workflow can deploy — the API call is
#
#     gh api -X POST repos/{owner}/{repo}/pages -f build_type=workflow
#
# and setting the repo to private turns Pages off (GH Free has no private Pages).
#
# No build step — site/ is plain HTML/CSS/JS. It is assembled into _site/
# together with results/ so the page is served from the site root (/) and
# app.js still finds its data at /results/latest.json.

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "items/bench10/**"
      - "tools/build_items_index.py"
      - "tools/stamp_assets.py"
      - "results/latest.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          set -euo pipefail
          # Rebuild the item-set index so the deployed table can never be stale.
          python3 tools/build_items_index.py --items items/bench10 --out site/items.json
          rm -rf _site
          mkdir -p _site/results
          cp -R site/. _site/
          cp -R results/. _site/results/
          touch _site/.nojekyll
          # Pages serves assets with max-age=600, so an unchanged app.js URL means
          # a browser can run yesterday's JS against today's HTML for ten minutes.
          # Hash-stamp the deployed copy only; site/index.html stays clean.
          python3 tools/stamp_assets.py _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
