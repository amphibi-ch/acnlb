name: ci

# The harness's load-bearing property is determinism: scoring the same
# (response, rubric, verdicts) twice must be byte-identical. That is cheap to
# check and expensive to find out late, so it runs on every push and PR.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install pyyaml pytest

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Site JS parses
        run: |
          set -euo pipefail
          node --check site/item-form.js
          node --check site/form-ui.js
          node --check site/app.js

      - name: Committed site data matches the package
        run: |
          set -euo pipefail
          # site/schema.json is what the web form trusts to decide what is valid.
          # If it drifts from the package, the form starts accepting items the CLI
          # refuses — silently, and in someone else's checkout.
          python -m tools.build_site_schema --out /tmp/schema.json
          diff /tmp/schema.json site/schema.json
          python -m tools.build_items_index --items items/bench10 --out /tmp/items.json
          diff /tmp/items.json site/items.json

      - name: Download bundles are byte-reproducible
        run: |
          set -euo pipefail
          python -m tools.build_bundle --items items/bench10 --workspace --out /tmp/dl-a
          python -m tools.build_bundle --items items/bench10 --workspace --out /tmp/dl-b
          diff -r /tmp/dl-a /tmp/dl-b

      - name: Download bundles are valid and checksummed
        run: |
          set -euo pipefail
          cd /tmp/dl-a
          shasum -a 256 -c SHA256SUMS
          python -c "import zipfile; z=zipfile.ZipFile('acnlb-bench10.zip'); assert z.testzip() is None"
          mkdir -p unpacked && python -c "import zipfile; zipfile.ZipFile('acnlb-bench10.zip').extractall('unpacked')"
          cd - >/dev/null
          python -m acnlb validate --items /tmp/dl-a/unpacked/bench10

      - name: Validate every published item set
        run: |
          set -euo pipefail
          python -m acnlb validate --items items/sample
          python -m acnlb validate --items items/bench10

      - name: Scoring is pure — same inputs, byte-identical output
        run: |
          set -euo pipefail
          args="--response items/sample/fixtures/core-tx-0001.good.txt
                --verdicts items/sample/fixtures/core-tx-0001.good.verdicts.json
                --rubric items/sample/core-tx-0001.rubric.md"
          python -m acnlb score $args --json > /tmp/a.json
          python -m acnlb score $args --json > /tmp/b.json
          diff /tmp/a.json /tmp/b.json
          echo "deterministic: $(cat /tmp/a.json)"
